<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unbagrnd</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <img class="brand-mark" src="logo.png" alt="" width="44" height="44" />
        <div class="brand-text">
          <div class="brand-name-row">
            <span class="brand-name"><span class="brand-name-initial">u</span>nbagrnd</span>
            <span class="brand-version">0.1.0</span>
          </div>
          <p class="brand-tagline">AI-powered background removal — 100% on your device.</p>
        </div>
        <button id="settings-btn" class="btn-icon" type="button" aria-label="Settings" title="Settings">⚙</button>
      </header>

      <section class="model-bar">
        <div class="model-bar-row">
          <label class="model-bar-label" for="model-select">Model</label>
          <select id="model-select" class="model-select"></select>
          <span id="model-badge" class="model-badge"></span>
          <button id="model-download-btn" class="btn btn-primary btn-sm" type="button" hidden>Download</button>
        </div>
        <div id="model-download-progress" class="model-download-progress" hidden>
          <div class="progress-track">
            <div id="model-progress-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <span id="model-progress-label">0%</span>
        </div>
        <p id="model-desc" class="model-desc"></p>
      </section>

      <nav class="tabs" role="tablist" aria-label="Mode">
        <button class="tab active" id="tab-single" role="tab" aria-selected="true" type="button">Single</button>
        <button class="tab" id="tab-batch" role="tab" aria-selected="false" type="button">Batch</button>
      </nav>

      <main>
        <section id="panel-single" class="panel" role="tabpanel" aria-labelledby="tab-single">
          <div id="single-dropzone" class="dropzone">
            <div class="dropzone-inner">
              <span class="dropzone-icon" aria-hidden="true">⬆</span>
              <p>Drag &amp; drop an image here</p>
              <p class="dropzone-sub">or</p>
              <button id="single-pick-btn" class="btn btn-secondary" type="button">Choose an image…</button>
            </div>
          </div>

          <div id="single-loading" class="loading-panel" hidden>
            <div class="spinner"></div>
            <p id="single-loading-text">Preparing…</p>
            <div class="single-loading-progress">
              <div class="progress-track">
                <div id="single-progress-fill" class="progress-fill" style="width: 0%"></div>
              </div>
              <span id="single-progress-label">0%</span>
            </div>
          </div>

          <div id="single-result" class="result" hidden>
            <div class="preview-grid">
              <figure class="preview">
                <figcaption>Before</figcaption>
                <div class="preview-frame"><img id="preview-before" alt="Original image" /></div>
              </figure>
              <figure class="preview">
                <figcaption>After</figcaption>
                <div class="preview-frame checkerboard"><img id="preview-after" alt="Background removed" /></div>
              </figure>
            </div>
            <div class="result-actions">
              <span id="single-output-path" class="output-path"></span>
              <div class="result-buttons">
                <button id="single-reveal-btn" class="btn btn-secondary" type="button">Reveal in folder</button>
                <button id="single-reset-btn" class="btn btn-secondary" type="button">Process another</button>
              </div>
            </div>
          </div>
        </section>

        <section id="panel-batch" class="panel" role="tabpanel" aria-labelledby="tab-batch" hidden>
          <div id="batch-dropzone" class="dropzone">
            <div class="dropzone-inner">
              <span class="dropzone-icon" aria-hidden="true">⬆</span>
              <p>Drag &amp; drop images or a folder here</p>
              <p class="dropzone-sub">or</p>
              <div class="dropzone-buttons">
                <button id="batch-pick-files-btn" class="btn btn-secondary" type="button">Choose images…</button>
                <button id="batch-pick-folder-btn" class="btn btn-secondary" type="button">Choose a folder…</button>
              </div>
            </div>
          </div>

          <div id="batch-result" class="result" hidden>
            <div class="batch-progress">
              <div class="progress-track">
                <div id="batch-progress-fill" class="progress-fill" style="width: 0%"></div>
              </div>
              <span id="batch-progress-label">0 / 0</span>
            </div>
            <ul id="batch-file-list" class="file-list"></ul>
            <div class="result-actions">
              <button id="batch-reveal-btn" class="btn btn-secondary" type="button">Reveal output folder</button>
              <button id="batch-reset-btn" class="btn btn-secondary" type="button">Process another batch</button>
            </div>
          </div>
        </section>
      </main>

      <section class="output-settings">
        <label class="output-settings-label" for="output-dir-display">Save to</label>
        <div class="output-settings-row">
          <span id="output-dir-display" class="output-dir-display">Same folder as the original image</span>
          <button id="choose-output-dir-btn" class="btn btn-link" type="button">Change…</button>
          <button id="clear-output-dir-btn" class="btn btn-link" type="button" hidden>Reset to default</button>
        </div>
      </section>

      <footer class="app-footer">
        <span id="status-line">Ready.</span>
        <span id="resource-usage" class="resource-usage"></span>
      </footer>
    </div>

    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-close-btn" class="btn-icon" type="button" aria-label="Close settings">✕</button>
        </div>
        <div class="settings-body">
          <section class="settings-section">
            <h3>Appearance</h3>
            <div class="settings-row">
              <span>Theme</span>
              <select id="theme-select">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </section>

          <section class="settings-section">
            <h3>Models</h3>
            <ul id="settings-model-list" class="settings-model-list"></ul>
            <button id="clear-all-models-btn" class="btn btn-link" type="button">Clear all cached models</button>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
