[package]
name = "unbagrnd"
version = "0.4.0"
description = "Remove image backgrounds locally, entirely on-device. No cloud, no account, no telemetry."
authors = ["zidniryi"]
license = "MIT"
repository = "https://github.com/unbagrnd/unbagrnd"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unbagrnd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Reading picked/dropped image files. On desktop this is a thin wrapper
# around std::fs; on Android it's required - the file picker returns
# `content://` URIs, not real filesystem paths, and only this plugin knows
# how to resolve those (via the OS's ContentResolver) into readable bytes.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Model catalog, model download/caching and ONNX Runtime inference - shared
# with the self-hosted REST API in `api/` so there's exactly one
# implementation of the actual background-removal pipeline.
unbagrnd-core = { path = "../core" }

# Image decode/resize/encode (used directly by the background/refine editors).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }

tokio = { version = "1", features = ["rt", "fs", "io-util"] }

# Encoding before/after previews as data URLs for the frontend, so the
# webview never needs filesystem or asset-protocol access.
base64 = "0.23"

# System-wide CPU/RAM usage shown in the footer.
sysinfo = "0.33"
